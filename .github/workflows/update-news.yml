name: Update whisky news
on:
  schedule:
    # Every hour at minute 17 (UTC and JST have the same minute)
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Commit updated JSON
        run: |
          if ! git diff --quiet -- data/news.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/news.json
            git commit -m 'chore: update whisky news'
            git push
          fi
